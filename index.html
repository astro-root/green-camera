<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CHROMA AR — Quiz Overlay Prototype</title>
<style>
:root {
  --bg: #10131a;
  --panel: #171b22;
  --panel-raised: #1c2129;
  --hairline: #2a303a;
  --text: #e7ebef;
  --text-dim: #838d98;
  --text-faint: #4d5561;
  --tally: #ff4433;
  --signal: #f2a541;
  --signal-dim: #6b5330;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overscroll-behavior: none;
}
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}
#topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px calc(8px + env(safe-area-inset-top) * 0);
  background: var(--panel);
  border-bottom: 1px solid var(--hairline);
}
#brand {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--text-dim);
}
#brand span { color: var(--signal); }
#readout {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--text-dim);
}
#tally {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-faint);
  flex-shrink: 0;
}
#tally.live {
  background: var(--tally);
  box-shadow: 0 0 6px var(--tally);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
#stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
}
video { display: none; }
#frame {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  line-height: 0;
}
canvas#output {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  display: block;
  background: #05070a;
}
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  pointer-events: none;
  opacity: 0.75;
}
.corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--signal); border-left: 2px solid var(--signal); }
.corner.tr { top: -1px; right: -1px; border-top: 2px solid var(--signal); border-right: 2px solid var(--signal); }
.corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--signal); border-left: 2px solid var(--signal); }
.corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--signal); border-right: 2px solid var(--signal); }
#vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
}
#idleOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#idleOverlay .noSignal {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.25em;
  color: var(--text-faint);
}
#idleOverlay .hint {
  font-size: 12px;
  color: var(--text-dim);
  max-width: 260px;
  text-align: center;
  line-height: 1.6;
}
#idleOverlay.hidden { opacity: 0; }
#controls {
  flex-shrink: 0;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--panel);
  border-top: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 46vh;
  overflow-y: auto;
}
.row { display: flex; gap: 8px; }
button, .fileBtn {
  appearance: none;
  border: none;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 600;
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  color: var(--text);
  flex: 1;
  text-align: center;
  position: relative;
}
button {
  background: var(--signal-dim);
  border-color: var(--signal);
  color: #fff2df;
}
button:active { background: #806332; }
button:disabled { background: var(--panel-raised); border-color: var(--hairline); color: var(--text-faint); }
.fileBtn { overflow: hidden; }
.fileBtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
details {
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 2px 12px;
}
summary {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  padding: 9px 0;
  text-transform: uppercase;
}
.slider {
  display: grid;
  grid-template-columns: 84px 1fr 42px;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-top: 1px solid var(--hairline);
}
.slider:first-of-type { border-top: none; }
.slider label { font-size: 11.5px; color: var(--text-dim); }
.slider input[type=range] {
  width: 100%;
  accent-color: var(--signal);
}
.slider span {
  font-family: var(--mono);
  font-size: 11px;
  text-align: right;
  color: var(--text);
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">CHROMA<span>AR</span></div>
    <div id="readout">
      <span id="tally"></span>
      <span id="readoutText">NO SIGNAL</span>
    </div>
  </div>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="frame">
      <canvas id="output"></canvas>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="vignette"></div>
    </div>
    <div id="idleOverlay">
      <div class="noSignal">NO SIGNAL</div>
      <div class="hint">「カメラ開始」を押してから、緑色の板をカメラに映してください</div>
    </div>
  </div>
  <div id="controls">
    <div class="row">
      <button id="startBtn">カメラ開始</button>
      <label class="fileBtn">クイズ画像を選択
        <input type="file" id="quizInput" accept="image/*">
      </label>
    </div>
    <details>
      <summary>Chroma Key</summary>
      <div class="slider">
        <label for="hueCenter">色相中心</label>
        <input type="range" id="hueCenter" min="0" max="360" value="120">
        <span id="hueCenterVal">120</span>
      </div>
      <div class="slider">
        <label for="hueTol">色相許容幅</label>
        <input type="range" id="hueTol" min="5" max="90" value="35">
        <span id="hueTolVal">35</span>
      </div>
      <div class="slider">
        <label for="satMin">彩度下限</label>
        <input type="range" id="satMin" min="0" max="100" value="25">
        <span id="satMinVal">0.25</span>
      </div>
      <div class="slider">
        <label for="valMin">明度下限</label>
        <input type="range" id="valMin" min="0" max="100" value="20">
        <span id="valMinVal">0.20</span>
      </div>
    </details>
    <details>
      <summary>Finishing / Performance</summary>
      <div class="slider">
        <label for="featherR">エッジ滑らかさ</label>
        <input type="range" id="featherR" min="0" max="8" value="3">
        <span id="featherRVal">3</span>
      </div>
      <div class="slider">
        <label for="denoiseIter">ノイズ除去</label>
        <input type="range" id="denoiseIter" min="0" max="3" value="1">
        <span id="denoiseIterVal">1</span>
      </div>
      <div class="slider">
        <label for="procWidth">処理解像度</label>
        <input type="range" id="procWidth" min="240" max="640" step="40" value="360">
        <span id="procWidthVal">360</span>
      </div>
    </details>
  </div>
</div>
<script>
const video = document.getElementById('video');
const output = document.getElementById('output');
const octx = output.getContext('2d', { willReadFrequently: true });
const startBtn = document.getElementById('startBtn');
const quizInput = document.getElementById('quizInput');
const tally = document.getElementById('tally');
const readoutText = document.getElementById('readoutText');
const idleOverlay = document.getElementById('idleOverlay');

const hueCenterInput = document.getElementById('hueCenter');
const hueTolInput = document.getElementById('hueTol');
const satMinInput = document.getElementById('satMin');
const valMinInput = document.getElementById('valMin');
const featherRInput = document.getElementById('featherR');
const denoiseIterInput = document.getElementById('denoiseIter');
const procWidthInput = document.getElementById('procWidth');

const hueCenterVal = document.getElementById('hueCenterVal');
const hueTolVal = document.getElementById('hueTolVal');
const satMinVal = document.getElementById('satMinVal');
const valMinVal = document.getElementById('valMinVal');
const featherRVal = document.getElementById('featherRVal');
const denoiseIterVal = document.getElementById('denoiseIterVal');
const procWidthVal = document.getElementById('procWidthVal');

hueCenterInput.addEventListener('input', () => hueCenterVal.textContent = hueCenterInput.value);
hueTolInput.addEventListener('input', () => hueTolVal.textContent = hueTolInput.value);
satMinInput.addEventListener('input', () => satMinVal.textContent = (satMinInput.value / 100).toFixed(2));
valMinInput.addEventListener('input', () => valMinVal.textContent = (valMinInput.value / 100).toFixed(2));
featherRInput.addEventListener('input', () => featherRVal.textContent = featherRInput.value);
denoiseIterInput.addEventListener('input', () => denoiseIterVal.textContent = denoiseIterInput.value);
procWidthInput.addEventListener('input', () => {
  procWidthVal.textContent = procWidthInput.value;
  if (videoReady) resizeProcessing();
});

const vcanvas = document.createElement('canvas');
const vctx = vcanvas.getContext('2d', { willReadFrequently: true });
const qcanvas = document.createElement('canvas');
const qctx = qcanvas.getContext('2d', { willReadFrequently: true });

let procW = 360;
let procH = 0;
let procReady = false;
let videoReady = false;

let quizImg = null;
let quizImageData = null;
let outImageData = null;

let maskA = null;
let maskB = null;
let alphaTmp = null;
let alphaOut = null;

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  const v = max;
  return [h, s, v];
}

function drawQuizToCanvas() {
  if (!quizImg || !procReady) return;
  qcanvas.width = procW;
  qcanvas.height = procH;
  const iw = quizImg.naturalWidth, ih = quizImg.naturalHeight;
  const canvasRatio = procW / procH;
  const imgRatio = iw / ih;
  let sx, sy, sw, sh;
  if (imgRatio > canvasRatio) {
    sh = ih;
    sw = ih * canvasRatio;
    sx = (iw - sw) / 2;
    sy = 0;
  } else {
    sw = iw;
    sh = iw / canvasRatio;
    sx = 0;
    sy = (ih - sh) / 2;
  }
  qctx.clearRect(0, 0, procW, procH);
  qctx.drawImage(quizImg, sx, sy, sw, sh, 0, 0, procW, procH);
  quizImageData = qctx.getImageData(0, 0, procW, procH);
}

quizInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    quizImg = img;
    drawQuizToCanvas();
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

function allocateBuffers() {
  const n = procW * procH;
  maskA = new Float32Array(n);
  maskB = new Float32Array(n);
  alphaTmp = new Float32Array(n);
  alphaOut = new Float32Array(n);
  outImageData = octx.createImageData(procW, procH);
}

function resizeProcessing() {
  procW = Number(procWidthInput.value);
  procH = Math.round(procW * video.videoHeight / video.videoWidth);
  vcanvas.width = procW;
  vcanvas.height = procH;
  output.width = procW;
  output.height = procH;
  procReady = true;
  allocateBuffers();
  drawQuizToCanvas();
}

async function startCamera() {
  startBtn.disabled = true;
  readoutText.textContent = 'CONNECTING...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    if (video.videoWidth) {
      onVideoReady();
    } else {
      video.addEventListener('loadedmetadata', onVideoReady, { once: true });
    }
  } catch (err) {
    readoutText.textContent = 'ERROR';
    startBtn.disabled = false;
    alert('カメラの起動に失敗しました: ' + err.message);
  }
}

function onVideoReady() {
  resizeProcessing();
  videoReady = true;
  tally.classList.add('live');
  idleOverlay.classList.add('hidden');
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startCamera);

function erodeDilate(src, dst, w, h, grow) {
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = grow ? 0 : 1;
      neighborLoop:
      for (let dy = -1; dy <= 1; dy++) {
        const ny = y + dy;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx;
          const val = (ny < 0 || ny >= h || nx < 0 || nx >= w) ? 0 : src[ny * w + nx];
          if (grow) {
            if (val === 1) { v = 1; break neighborLoop; }
          } else {
            if (val === 0) { v = 0; break neighborLoop; }
          }
        }
      }
      dst[y * w + x] = v;
    }
  }
}

function boxBlurH(src, dst, w, h, r) {
  if (r <= 0) { dst.set(src); return; }
  const winSize = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const rowOff = y * w;
    let sum = 0;
    for (let xx = -r; xx <= r; xx++) {
      const cx = xx < 0 ? 0 : (xx >= w ? w - 1 : xx);
      sum += src[rowOff + cx];
    }
    for (let x = 0; x < w; x++) {
      dst[rowOff + x] = sum / winSize;
      const addX = x + r + 1;
      const subX = x - r;
      const addCx = addX >= w ? w - 1 : addX;
      const subCx = subX < 0 ? 0 : subX;
      sum += src[rowOff + addCx] - src[rowOff + subCx];
    }
  }
}

function boxBlurV(src, dst, w, h, r) {
  if (r <= 0) { dst.set(src); return; }
  const winSize = 2 * r + 1;
  for (let x = 0; x < w; x++) {
    let sum = 0;
    for (let yy = -r; yy <= r; yy++) {
      const cy = yy < 0 ? 0 : (yy >= h ? h - 1 : yy);
      sum += src[cy * w + x];
    }
    for (let y = 0; y < h; y++) {
      dst[y * w + x] = sum / winSize;
      const addY = y + r + 1;
      const subY = y - r;
      const addCy = addY >= h ? h - 1 : addY;
      const subCy = subY < 0 ? 0 : subY;
      sum += src[addCy * w + x] - src[subCy * w + x];
    }
  }
}

let lastFpsTime = performance.now();
let frameCount = 0;
let fps = 0;

function loop() {
  if (videoReady) {
    vctx.drawImage(video, 0, 0, procW, procH);
    const frame = vctx.getImageData(0, 0, procW, procH);
    const vd = frame.data;
    const qd = quizImageData ? quizImageData.data : null;
    const od = outImageData.data;
    const n = procW * procH;

    const hueCenter = Number(hueCenterInput.value);
    const hueTol = Number(hueTolInput.value);
    const satMin = Number(satMinInput.value) / 100;
    const valMin = Number(valMinInput.value) / 100;
    const featherR = Number(featherRInput.value);
    const denoiseIter = Number(denoiseIterInput.value);

    for (let p = 0; p < n; p++) {
      const i = p * 4;
      const hsv = rgbToHsv(vd[i], vd[i + 1], vd[i + 2]);
      let diff = Math.abs(hsv[0] - hueCenter);
      if (diff > 180) diff = 360 - diff;
      maskA[p] = (diff <= hueTol && hsv[1] >= satMin && hsv[2] >= valMin) ? 1 : 0;
    }

    let cur = maskA, other = maskB;
    for (let k = 0; k < denoiseIter; k++) {
      erodeDilate(cur, other, procW, procH, false);
      const t = cur; cur = other; other = t;
    }
    for (let k = 0; k < denoiseIter; k++) {
      erodeDilate(cur, other, procW, procH, true);
      const t = cur; cur = other; other = t;
    }

    boxBlurH(cur, alphaTmp, procW, procH, featherR);
    boxBlurV(alphaTmp, alphaOut, procW, procH, featherR);

    if (qd) {
      for (let p = 0; p < n; p++) {
        const i = p * 4;
        const a = alphaOut[p];
        od[i] = vd[i] + (qd[i] - vd[i]) * a;
        od[i + 1] = vd[i + 1] + (qd[i + 1] - vd[i + 1]) * a;
        od[i + 2] = vd[i + 2] + (qd[i + 2] - vd[i + 2]) * a;
        od[i + 3] = 255;
      }
    } else {
      od.set(vd);
    }

    octx.putImageData(outImageData, 0, 0);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
      fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;
      readoutText.textContent = procW + '×' + procH + ' / ' + fps + 'fps';
    }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
